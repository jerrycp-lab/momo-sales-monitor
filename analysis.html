<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 程式作業，交叉分析</title><meta name="robots" content="noindex, nofollow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0; --border2:#cbd5e1;
  --text:#1e293b; --text-mid:#475569; --text-dim:#94a3b8;
  --blue:#2563eb; --blue-lt:#dbeafe;
  --green:#16a34a; --green-lt:#dcfce7;
  --orange:#ea580c; --orange-lt:#ffedd5;
  --red:#dc2626; --red-lt:#fee2e2;
  --momo:#e84393; --momo-lt:#fce7f3;
  --purple:#7c3aed; --purple-lt:#ede9fe;
  --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:13px;}
::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* TOPBAR */
.topbar{background:#1a3a5c;color:#fff;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;}
.topbar-logo{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;}
.topbar-logo .icon{width:32px;height:32px;border-radius:8px;background:var(--purple);display:flex;align-items:center;justify-content:center;font-size:16px;}
.topbar-nav{display:flex;gap:6px;margin-left:18px;}
.topbar-nav a{color:rgba(255,255,255,.65);text-decoration:none;font-size:12px;padding:6px 12px;border-radius:7px;transition:all .15s;}
.topbar-nav a:hover{background:rgba(255,255,255,.08);color:#fff;}
.topbar-nav a.active{background:rgba(255,255,255,.14);color:#fff;font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:16px;font-size:12px;color:rgba(255,255,255,.6);}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:blink 2s infinite;display:inline-block;margin-right:4px;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* CONTENT */
.content{padding:20px 24px;}

/* 查詢列（期間篩選） */
.query-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);flex-wrap:wrap;}
.q-label{font-size:13px;font-weight:700;color:var(--text-mid);white-space:nowrap;}
.q-date{padding:6px 12px;border-radius:7px;border:1px solid var(--border2);font-family:inherit;font-size:13px;color:var(--text);background:var(--bg);outline:none;cursor:pointer;}
.q-date:focus{border-color:var(--blue);}
.q-sep{color:var(--text-dim);}
.quick-btn{padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:transparent;font-family:inherit;color:var(--text-dim);transition:all .15s;font-weight:600;}
.quick-btn:hover{border-color:var(--purple);color:var(--purple);}
.quick-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);}
.q-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.reload-btn{padding:6px 14px;border-radius:7px;background:var(--blue);color:#fff;border:none;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;}
.reload-btn:hover{background:#1d4ed8;}
.last-update{font-size:11px;color:var(--text-dim);}

/* 主分類頁籤 */
.main-tabs{display:flex;gap:8px;margin-bottom:12px;}
.main-tab{padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);box-shadow:var(--shadow);transition:all .15s;}
.main-tab:hover{border-color:var(--purple);color:var(--purple);}
.main-tab.active{background:var(--purple);color:#fff;border-color:var(--purple);}

/* 子頁籤 */
.sub-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.sub-tab{padding:7px 16px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);transition:all .15s;}
.sub-tab:hover{border-color:var(--momo);color:var(--momo);}
.sub-tab.active{background:var(--momo);color:#fff;border-color:var(--momo);}

/* 卡片／表格（沿用 dashboard 風格） */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);}
.card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.card-dot{width:7px;height:7px;border-radius:50%;}
.sort-note{font-size:11px;color:var(--text-dim);}
table{width:100%;border-collapse:collapse;}
thead th{padding:9px 14px;text-align:left;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;background:#f8fafc;border-bottom:1px solid var(--border);font-weight:500;}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#f8fafc;}
tbody td{padding:9px 14px;vertical-align:middle;}
.prod-name{font-weight:600;font-size:12px;}
.prod-brand{font-size:11px;color:var(--text-dim);}
.qty{font-family:'DM Mono',monospace;font-size:12px;}
.zero{color:var(--text-dim);}
.slot-tag{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700;white-space:nowrap;}
.tag-0000{background:#f1f5f9;color:#64748b;}
.tag-0700{background:var(--green-lt);color:var(--green);}
.tag-1100{background:var(--blue-lt);color:var(--blue);}
.tag-1400{background:#ede9fe;color:#7c3aed;}
.tag-1800{background:var(--orange-lt);color:var(--orange);}
.tag-2200{background:#fce7f3;color:var(--momo);}
.disc-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;background:var(--orange-lt);color:var(--orange);}

/* 統計卡 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.sc-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.sc-label{font-size:11px;color:var(--text-dim);}
.sc-ico{font-size:18px;}
.sc-val{font-size:22px;font-weight:700;font-family:'DM Mono',monospace;}
.sc-note{font-size:11px;color:var(--text-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* placeholder */
.placeholder{padding:60px 20px;text-align:center;color:var(--text-dim);}
.placeholder .big{font-size:32px;margin-bottom:10px;}

/* 載入狀態 */
.loading{text-align:center;padding:60px;color:var(--text-dim);}
.loading-spin{font-size:32px;animation:spin 1s linear infinite;display:inline-block;margin-bottom:12px;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.error-msg{background:var(--red-lt);color:var(--red);padding:16px;border-radius:var(--radius);margin-bottom:16px;font-size:13px;}

/* 搜尋框（商品履歷查詢用） */
.search-box{padding:7px 12px;border-radius:7px;border:1px solid var(--border2);font-family:inherit;font-size:13px;color:var(--text);background:var(--bg);outline:none;min-width:220px;}
.search-box:focus{border-color:var(--blue);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <div class="icon">📊</div>
    AI 程式作業，交叉分析
    <div class="topbar-nav">
      <a href="dashboard.html">即時監控</a>
      <a href="analysis.html" class="active">交叉分析</a>
    </div>
  </div>
  <div class="topbar-right">
    <span><span class="live-dot"></span>即時資料</span>
    <span id="lastUpdate">載入中...</span>
  </div>
</div>

<div class="content">

  <!-- 期間篩選列 -->
  <div class="query-bar">
    <span class="q-label">📅 期間</span>
    <input type="date" id="startDate" class="q-date" onchange="onManualDateChange()">
    <span class="q-sep">至</span>
    <input type="date" id="endDate" class="q-date" onchange="onManualDateChange()">
    <div style="display:flex;gap:5px;flex-wrap:wrap;" id="quickBtns">
      <button class="quick-btn active" onclick="selectQuickRange(7,this)">近7天</button>
      <button class="quick-btn" onclick="selectQuickRange(30,this)">近30天</button>
      <button class="quick-btn" onclick="selectQuickRange('month',this)">本月</button>
    </div>
    <span class="q-label">🏷️ 品類</span>
    <select id="catL1Filter" class="q-date" onchange="onCatL1Change()"><option value="">全部大類</option></select>
    <select id="catL2Filter" class="q-date" onchange="renderCurrentView()"><option value="">全部中類</option></select>
    <div class="q-right">
      <span class="last-update" id="csvLastUpdate"></span>
      <button class="reload-btn" onclick="loadData()">🔄 重新載入</button>
    </div>
  </div>

  <div id="estNotice" style="display:none;background:var(--red-lt);color:var(--red);padding:10px 16px;border-radius:var(--radius);margin-bottom:16px;font-size:12px"></div>
  <div id="errorMsg" class="error-msg" style="display:none"></div>
  <div id="loadingArea" class="loading">
    <div class="loading-spin">⏳</div>
    <div>載入資料中...</div>
  </div>

  <div id="mainContent" style="display:none">

    <!-- 主分類頁籤 -->
    <div class="main-tabs">
      <div class="main-tab active" data-main="product" onclick="selectMainTab('product')">🛒 商品分析</div>
      <div class="main-tab" data-main="dimension" onclick="selectMainTab('dimension')">📈 維度排行</div>
    </div>

    <!-- 商品分析：子頁籤 -->
    <div id="tabs-product" class="sub-tabs">
      <div class="sub-tab active" data-sub="rank" onclick="selectSubTab('product','rank')">商品排行榜</div>
      <div class="sub-tab" data-sub="history" onclick="selectSubTab('product','history')">商品履歷查詢</div>
    </div>

    <!-- 維度排行：子頁籤 -->
    <div id="tabs-dimension" class="sub-tabs" style="display:none">
      <div class="sub-tab active" data-sub="category" onclick="selectSubTab('dimension','category')">品類排行榜</div>
      <div class="sub-tab" data-sub="brand" onclick="selectSubTab('dimension','brand')">品牌排行榜</div>
      <div class="sub-tab" data-sub="slot" onclick="selectSubTab('dimension','slot')">檔期整體表現比較</div>
      <div class="sub-tab" data-sub="weekday" onclick="selectSubTab('dimension','weekday')">星期效應</div>
      <div class="sub-tab" data-sub="price" onclick="selectSubTab('dimension','price')">價格帶表現</div>
    </div>

    <!-- 內容區：各子頁籤對應一個 view -->
    <div id="view-rank" class="view-panel"></div>
    <div id="view-history" class="view-panel" style="display:none"></div>
    <div id="view-category" class="view-panel" style="display:none"></div>
    <div id="view-brand" class="view-panel" style="display:none"></div>
    <div id="view-slot" class="view-panel" style="display:none"></div>
    <div id="view-weekday" class="view-panel" style="display:none"></div>
    <div id="view-price" class="view-panel" style="display:none"></div>

  </div>
</div>

<script>
// ── 設定：你的 GitHub 帳號和 repo 名稱 ──
const GITHUB_USER = 'jerrycp-lab';
const GITHUB_REPO = 'momo-sales-monitor';
const CSV_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/snapshots/all_results.csv`;
const CAT_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/snapshots/momo_categories.csv`;
const UNCAT = '未分類';
// ─────────────────────────────────────────

// 價格帶分界（依實際資料分布統計後決定，見討論記錄）
const PRICE_BANDS = [
  {label:'<500',        min:0,     max:499},
  {label:'500–1,500',   min:500,   max:1499},
  {label:'1,500–5,000', min:1500,  max:4999},
  {label:'5,000–15,000',min:5000,  max:14999},
  {label:'15,000+',     min:15000, max:Infinity},
];

let allData = [];
let curMain = 'product';
let curSub  = { product: 'rank', dimension: 'category' };

window.addEventListener('load', loadData);

async function loadData() {
  document.getElementById('loadingArea').style.display = 'block';
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';

  try {
    const res = await fetch(CSV_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('無法讀取資料（' + res.status + '）');
    const text = await res.text();
    allData = parseCSV(text);

    if (allData.length === 0) throw new Error('資料檔案是空的');

    fixTruncatedQty(allData);

    // 品類對照表（momo 大類/中類）。檔案還沒產生也不影響其他分析
    let catMap = {};
    try {
      const cres = await fetch(CAT_URL + '?t=' + Date.now());
      if (cres.ok) parseCSV(await cres.text(), 'icode').forEach(c => { if (c.cat_l1) catMap[c.icode] = c; });
    } catch(e) {}
    allData.forEach(r => {
      const c = catMap[r.icode];
      r.cat1 = c ? c.cat_l1 : UNCAT;
      r.cat2 = c ? (c.cat_l2 || UNCAT) : UNCAT;
    });
    fillCatL1Options();

    const dates = [...new Set(allData.map(r => r.date))].sort();
    const earliestDate = dates[0];
    const latestDate = dates[dates.length - 1];

    const startInput = document.getElementById('startDate');
    const endInput = document.getElementById('endDate');
    startInput.max = endInput.max = fmtLocalDate(new Date());
    applyQuickRange(7);
    document.querySelectorAll('#quickBtns .quick-btn').forEach((b, i) => b.classList.toggle('active', i === 0));

    document.getElementById('lastUpdate').textContent = '最後載入：' + new Date().toLocaleTimeString('zh-TW');
    document.getElementById('csvLastUpdate').textContent = `資料範圍：${earliestDate} ～ ${latestDate}`;

    document.getElementById('loadingArea').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    renderCurrentView();

  } catch(e) {
    document.getElementById('loadingArea').style.display = 'none';
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'block';
    errEl.textContent = '⚠️ 載入失敗：' + e.message + '（資料可能還未產生，請稍後重試）';
  }
}

function parseCSV(text, keyField = 'date') {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/^﻿/,''));
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
    return obj;
  }).filter(r => r[keyField]);
}

// ── 千位數推估 ──
// 2026/10/07 11:00 檔（含）以前，舊版抓取程式把「倒數：1,951組」只讀成 1。
// 這裡在顯示時推估還原，不改動原始 CSV。推估值一律以紅字標示。
//   calc ：同一檔內數量不減反增（例如 開檔1 → 中段949），可確定開檔是千位數，
//          以「千位整數」作為開檔推估值（例如 1 → 1,000），並重算售出與售出率
//   doubt：同商品在別檔已確定是千位數，這一檔開檔也是個位數但無法從數字本身判斷
const EST_LAST_OLD = { date: '2026/10/07', slot: '11:00' };

function isOldParserRow(r) {
  return r.date < EST_LAST_OLD.date || (r.date === EST_LAST_OLD.date && r.slot <= EST_LAST_OLD.slot);
}

function fixTruncatedQty(rows) {
  const num = v => (v !== undefined && /^\d+$/.test(v)) ? parseInt(v) : null;
  const proven = new Set();
  rows.forEach(r => {
    if (!isOldParserRow(r)) return;
    const o = num(r.qty_open), m = num(r.mid_qty), c = num(r.qty_close);
    if (o === null || o < 1 || o > 9) return;
    const later = Math.max(m || 0, c || 0);
    if (later < 500 || later <= o || later > o * 1000 + 999) return;
    const est = Math.max(o * 1000, later);
    r.est = 'calc';
    r.qty_open_raw = r.qty_open;
    r.sold_raw = r.sold;
    r.qty_open = String(est);
    if (m !== null && m >= 1 && m <= 9 && c !== null && c > m && c >= 500) {
      r.mid_qty = String(Math.min(Math.max(m * 1000, c), est));
      r.mid_est = true;
    }
    const sold = Math.max(est - (c || 0), 0);
    r.sold = String(sold);
    r.sell_rate = (sold / est * 100).toFixed(1);
    proven.add(r.icode);
  });
  rows.forEach(r => {
    if (r.est || !isOldParserRow(r) || !proven.has(r.icode)) return;
    const o = num(r.qty_open);
    if (o !== null && o >= 1 && o <= 9) r.est = 'doubt';
  });
}

function fmtInt(v) { const n = parseInt(v); return isNaN(n) ? v : n.toLocaleString('zh-TW'); }

function updateEstNotice(data) {
  const el = document.getElementById('estNotice');
  const calc = data.filter(r => r.est === 'calc').length;
  const doubt = data.filter(r => r.est === 'doubt').length;
  if (!calc && !doubt) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = `⚠️ 目前範圍內有 <b>${calc}</b> 筆開檔數量為推估值（舊版程式漏讀千位數，以千位整數還原，售出量為保守估計）`
    + (doubt ? `，另有 <b>${doubt}</b> 筆數量存疑、無法推估` : '') + `。相關數字以紅字標示。`;
}

// ── 品類篩選 ──
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function fillCatL1Options() {
  const sel = document.getElementById('catL1Filter');
  const keep = sel.value;
  const l1s = [...new Set(allData.map(r => r.cat1))].sort((a, b) => (a === UNCAT) - (b === UNCAT) || a.localeCompare(b, 'zh-TW'));
  sel.innerHTML = '<option value="">全部大類</option>' + l1s.map(v => `<option value="${escHtml(v)}">${escHtml(v)}</option>`).join('');
  sel.value = l1s.includes(keep) ? keep : '';
  fillCatL2Options();
}

function fillCatL2Options() {
  const l1 = document.getElementById('catL1Filter').value;
  const sel = document.getElementById('catL2Filter');
  const l2s = l1 ? [...new Set(allData.filter(r => r.cat1 === l1).map(r => r.cat2))].sort((a, b) => a.localeCompare(b, 'zh-TW')) : [];
  sel.innerHTML = '<option value="">全部中類</option>' + l2s.map(v => `<option value="${escHtml(v)}">${escHtml(v)}</option>`).join('');
  sel.disabled = !l1;
}

function onCatL1Change() { fillCatL2Options(); renderCurrentView(); }

function setCatFilter(l1) {
  document.getElementById('catL1Filter').value = l1;
  fillCatL2Options();
  catLevel = 'cat2';
  renderCurrentView();
}

// date字串格式為 YYYY/MM/DD，<input type=date> 需要 YYYY-MM-DD
function toInputDate(d) { return (d || '').replace(/\//g, '-'); }
function toDataDate(d) { return (d || '').replace(/-/g, '/'); }

// 以本地時間格式化為 YYYY-MM-DD（避免 toISOString 的 UTC 時區偏移）
function fmtLocalDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 設定起訖日期：數字=以資料最新日往前推N天；'month'=本月1日至今天
function applyQuickRange(range) {
  const dates = [...new Set(allData.map(r => r.date))].sort();
  if (dates.length === 0) return;
  const latestDate = dates[dates.length - 1];

  if (range === 'month') {
    const today = new Date();
    document.getElementById('startDate').value = fmtLocalDate(new Date(today.getFullYear(), today.getMonth(), 1));
    document.getElementById('endDate').value = fmtLocalDate(today);
  } else {
    const parts = latestDate.split('/').map(Number);
    const end = new Date(parts[0], parts[1]-1, parts[2]);
    const start = new Date(end);
    start.setDate(start.getDate() - (range - 1));
    document.getElementById('startDate').value = fmtLocalDate(start);
    document.getElementById('endDate').value = fmtLocalDate(end);
  }
}

function selectQuickRange(range, btn) {
  document.querySelectorAll('#quickBtns .quick-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyQuickRange(range);
  renderCurrentView();
}

function onManualDateChange() {
  document.querySelectorAll('#quickBtns .quick-btn').forEach(b => b.classList.remove('active'));
  renderCurrentView();
}

// 回傳目前期間篩選後的資料（依 startDate ~ endDate，皆為 YYYY/MM/DD 字串比較）
function getFilteredData() {
  const start = toDataDate(document.getElementById('startDate').value);
  const end   = toDataDate(document.getElementById('endDate').value);
  const l1 = document.getElementById('catL1Filter').value;
  const l2 = document.getElementById('catL2Filter').value;
  return allData.filter(r => {
    if (start && r.date < start) return false;
    if (end && r.date > end) return false;
    if (l1 && r.cat1 !== l1) return false;
    if (l2 && r.cat2 !== l2) return false;
    return true;
  });
}

function selectMainTab(main) {

function selectSubTab(main, sub) {

function slotTagClass(slot) {
  const map = {'00:00':'tag-0000','07:00':'tag-0700','11:00':'tag-1100','14:00':'tag-1400','18:00':'tag-1800','22:00':'tag-2200'};
  return map[slot] || 'tag-0700';
}

// ── 商品分析：共用 ── 將期間內資料依 icode 彙總
function buildProductSummary(data) {
  const map = {};
  data.forEach(r => {
    const icode = r.icode;
    if (!icode) return;
    if (!map[icode]) {
      map[icode] = { icode, name: r.name, brand: r.brand, cat1: r.cat1, cat2: r.cat2, listings: 0, totalSold: 0, totalRevenue: 0, rateSum: 0, soldOutCount: 0, lastDate: r.date, estCount: 0, doubtCount: 0 };
    }
    const m = map[icode];
    if (r.est === 'calc') m.estCount += 1;
    if (r.est === 'doubt') m.doubtCount += 1;
    const sold = parseInt(r.sold) || 0;
    const price = parseFloat(r.price) || 0;
    const rate = parseFloat(r.sell_rate) || 0;
    m.listings += 1;
    m.totalSold += sold;
    m.totalRevenue += sold * price;
    m.rateSum += rate;
    if (r.sold_out === '是') m.soldOutCount += 1;
    if (r.date >= m.lastDate) { m.lastDate = r.date; m.name = r.name; m.brand = r.brand; }
  });
  return Object.values(map).map(m => ({ ...m, avgRate: m.listings ? (m.rateSum / m.listings) : 0 }));
}

// ── 維度排行：共用 ── 依任意 key 彙總
function aggregateByKey(data, keyFn) {
  const map = {};
  data.forEach(r => {
    const key = keyFn(r);
    if (key === null || key === undefined || key === '') return;
    if (!map[key]) map[key] = { key, listings: 0, icodes: new Set(), totalSold: 0, totalRevenue: 0, rateSum: 0, soldOutCount: 0 };
    const g = map[key];
    const sold = parseInt(r.sold) || 0;
    const price = parseFloat(r.price) || 0;
    const rate = parseFloat(r.sell_rate) || 0;
    g.listings += 1;
    g.icodes.add(r.icode);
    g.totalSold += sold;
    g.totalRevenue += sold * price;
    g.rateSum += rate;
    if (r.sold_out === '是') g.soldOutCount += 1;
  });
  return Object.values(map).map(g => ({
    key: g.key,
    listings: g.listings,
    productCount: g.icodes.size,
    totalSold: g.totalSold,
    totalRevenue: g.totalRevenue,
    avgRate: g.listings ? g.rateSum / g.listings : 0,
    soldOutCount: g.soldOutCount,
    soldOutRate: g.listings ? (g.soldOutCount / g.listings * 100) : 0,
  }));
}

function miniBar(value, max, color) {
  const w = max > 0 ? Math.min(Math.round(value / max * 100), 100) : 0;
  return `<div style="display:flex;align-items:center;gap:8px">
    <div style="flex:1;height:14px;background:var(--border);border-radius:4px;overflow:hidden;max-width:140px">
      <div style="height:100%;width:${w}%;background:${color}"></div>
    </div>
    <div style="font-size:11px;font-family:'DM Mono',monospace;min-width:42px;color:var(--text-mid)">${value.toFixed(1)}%</div>
  </div>`;
}

      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>#</th><th>品牌</th><th>商品種數</th><th>上架次數</th><th>總銷售量</th><th>平均售出率</th><th>售完次數</th><th>期間營收</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8" style="text-align:center;color:var(--text-dim);padding:30px">此期間無資料</td></tr>'}</tbody>
      </table></div>
      ${sorted.length > 100 ? `<div style="padding:10px 16px;font-size:11px;color:var(--text-dim)">僅顯示前100個品牌（共${sorted.length}個）</div>` : ''}
    </div>
  `;
}

// ── 檔期整體表現比較 ──
const SLOT_ORDER = ['00:00', '07:00', '11:00', '14:00', '18:00', '22:00'];

function renderSlot(data) {
  const summary = aggregateByKey(data, r => r.slot);
  const map = {}; summary.forEach(s => map[s.key] = s);
  const rows = SLOT_ORDER.map(slot => map[slot] || { key: slot, listings: 0, productCount: 0, totalSold: 0, totalRevenue: 0, avgRate: 0, soldOutCount: 0, soldOutRate: 0 });

  const best = [...rows].filter(r => r.listings > 0).sort((a, b) => b.avgRate - a.avgRate)[0];

  const trs = rows.map(r => `
    <tr>
      <td><span class="slot-tag ${slotTagClass(r.key)}">${r.key}</span></td>
      <td class="qty">${r.listings}</td>
      <td class="qty">${r.productCount}</td>
      <td class="qty" style="color:var(--blue);font-weight:700">${r.totalSold}</td>
      <td>${miniBar(r.avgRate, 100, 'var(--green)')}</td>
      <td class="qty">${r.soldOutCount}（${r.soldOutRate.toFixed(0)}%）</td>
      <td class="qty">${fmtMoney(r.totalRevenue)}</td>
    </tr>
  `).join('');

  document.getElementById('view-slot').innerHTML = `
    ${best ? `<div class="sum-row" style="background:var(--green-lt);margin-bottom:16px;padding:12px 16px;border-radius:var(--radius)">
      <span style="color:var(--green);font-weight:700">💡 期間內表現最好的檔期：${best.key}</span>
      <span style="color:var(--text-mid)">平均售出率 ${best.avgRate.toFixed(1)}%</span>
    </div>` : ''}
    <div class="card">
      <div class="card-header"><div class="card-title"><div class="card-dot" style="background:var(--green)"></div>檔期整體表現比較</div></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>檔期</th><th>上架次數</th><th>商品種數</th><th>總銷售量</th><th>平均售出率</th><th>售完次數</th><th>期間營收</th></tr></thead>
        <tbody>${trs}</tbody>
      </table></div>
    </div>
  `;
}

// ── 星期效應 ──
const WEEKDAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
const WEEKDAY_LABELS = { 1: '週一', 2: '週二', 3: '週三', 4: '週四', 5: '週五', 6: '週六', 0: '週日' };

function weekdayKey(dateStr) {
  const parts = (dateStr || '').split('/').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return null;
  return new Date(parts[0], parts[1] - 1, parts[2]).getDay();
}

function renderWeekday(data) {
  const summary = aggregateByKey(data, r => weekdayKey(r.date));
  const map = {}; summary.forEach(s => map[s.key] = s);
  const rows = WEEKDAY_ORDER.map(k => map[k] || { key: k, listings: 0, productCount: 0, totalSold: 0, totalRevenue: 0, avgRate: 0, soldOutCount: 0, soldOutRate: 0 });

  const best = [...rows].filter(r => r.listings > 0).sort((a, b) => b.avgRate - a.avgRate)[0];

  const trs = rows.map(r => {
    const isWeekend = r.key === 0 || r.key === 6;
    return `<tr style="${isWeekend ? 'background:var(--bg)' : ''}">
      <td class="prod-name">${WEEKDAY_LABELS[r.key]}</td>
      <td class="qty">${r.listings}</td>
      <td class="qty">${r.productCount}</td>
      <td class="qty" style="color:var(--blue);font-weight:700">${r.totalSold}</td>
      <td>${miniBar(r.avgRate, 100, 'var(--orange)')}</td>
      <td class="qty">${r.soldOutCount}（${r.soldOutRate.toFixed(0)}%）</td>
      <td class="qty">${fmtMoney(r.totalRevenue)}</td>
    </tr>`;
  }).join('');

  document.getElementById('view-weekday').innerHTML = `
    ${best ? `<div class="sum-row" style="background:var(--orange-lt);margin-bottom:16px;padding:12px 16px;border-radius:var(--radius)">
      <span style="color:var(--orange);font-weight:700">💡 期間內表現最好的星期：${WEEKDAY_LABELS[best.key]}</span>
      <span style="color:var(--text-mid)">平均售出率 ${best.avgRate.toFixed(1)}%</span>
    </div>` : ''}
    <div class="card">
      <div class="card-header"><div class="card-title"><div class="card-dot" style="background:var(--orange)"></div>星期效應（灰底為週末）</div></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>星期</th><th>上架次數</th><th>商品種數</th><th>總銷售量</th><th>平均售出率</th><th>售完次數</th><th>期間營收</th></tr></thead>
        <tbody>${trs}</tbody>
      </table></div>
    </div>
  `;
}

// ── 價格帶表現 ──
function priceBandIndex(price) {
  const p = parseFloat(price);
  if (isNaN(p)) return -1;
  return PRICE_BANDS.findIndex(b => p >= b.min && p <= b.max);
}

function renderPrice(data) {
  const summary = aggregateByKey(data, r => priceBandIndex(r.price));
  const map = {}; summary.forEach(s => map[s.key] = s);
  const totalListings = data.length || 1;
  const rows = PRICE_BANDS.map((b, idx) => {
    const s = map[idx] || { listings: 0, productCount: 0, totalSold: 0, totalRevenue: 0, avgRate: 0, soldOutCount: 0, soldOutRate: 0 };
    return { ...s, label: b.label };
  });

  const best = [...rows].filter(r => r.listings > 0).sort((a, b) => b.avgRate - a.avgRate)[0];

  const trs = rows.map(r => `
    <tr>
      <td class="prod-name">${r.label}</td>
      <td class="qty">${r.listings}（${(r.listings / totalListings * 100).toFixed(0)}%）</td>
      <td class="qty">${r.productCount}</td>
      <td class="qty" style="color:var(--blue);font-weight:700">${r.totalSold}</td>
      <td>${miniBar(r.avgRate, 100, 'var(--momo)')}</td>
      <td class="qty">${r.soldOutCount}（${r.soldOutRate.toFixed(0)}%）</td>
      <td class="qty">${fmtMoney(r.totalRevenue)}</td>
    </tr>
  `).join('');

  document.getElementById('view-price').innerHTML = `
    ${best ? `<div class="sum-row" style="background:var(--momo-lt);margin-bottom:16px;padding:12px 16px;border-radius:var(--radius)">
      <span style="color:var(--momo);font-weight:700">💡 期間內表現最好的價格帶：${best.label}</span>
      <span style="color:var(--text-mid)">平均售出率 ${best.avgRate.toFixed(1)}%</span>
    </div>` : ''}
    <div class="card">
      <div class="card-header"><div class="card-title"><div class="card-dot" style="background:var(--momo)"></div>價格帶表現</div></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>價格帶</th><th>上架次數（佔比）</th><th>商品種數</th><th>總銷售量</th><th>平均售出率</th><th>售完次數</th><th>期間營收</th></tr></thead>
        <tbody>${trs}</tbody>
      </table></div>
    </div>
  `;
}

const RENDERERS = { category: renderCategory, rank: renderRank, history: renderHistory, brand: renderBrand, slot: renderSlot, weekday: renderWeekday, price: renderPrice };
</script>
