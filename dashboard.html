<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 程式作業，銷售監控</title><meta name="robots" content="noindex, nofollow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0; --border2:#cbd5e1;
  --text:#1e293b; --text-mid:#475569; --text-dim:#94a3b8;
  --blue:#2563eb; --blue-lt:#dbeafe;
  --green:#16a34a; --green-lt:#dcfce7;
  --orange:#ea580c; --orange-lt:#ffedd5;
  --red:#dc2626; --red-lt:#fee2e2;
  --momo:#e84393; --momo-lt:#fce7f3;
  --purple:#7c3aed;
  --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:13px;}
::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* TOPBAR */
.topbar{background:#1a3a5c;color:#fff;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;}
.topbar-logo{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;}
.topbar-logo .icon{width:32px;height:32px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px;}
     .topbar-nav{display:flex;gap:6px;margin-left:18px;}
     .topbar-nav a{color:rgba(255,255,255,.65);text-decoration:none;font-size:12px;padding:6px 12px;border-radius:7px;transition:all .15s;}
     .topbar-nav a:hover{background:rgba(255,255,255,.08);color:#fff;}
     .topbar-nav a.active{background:rgba(255,255,255,.14);color:#fff;font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:16px;font-size:12px;color:rgba(255,255,255,.6);}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:blink 2s infinite;display:inline-block;margin-right:4px;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* CONTENT */
.content{padding:20px 24px;}

/* 查詢列 */
.query-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);flex-wrap:wrap;}
.q-label{font-size:13px;font-weight:700;color:var(--text-mid);white-space:nowrap;}
.q-date{padding:6px 12px;border-radius:7px;border:1px solid var(--border2);font-family:inherit;font-size:13px;color:var(--text);background:var(--bg);outline:none;cursor:pointer;}
.q-date:focus{border-color:var(--blue);}
.slot-btn{padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:transparent;font-family:inherit;color:var(--text-dim);transition:all .15s;font-weight:600;}
.slot-btn:hover{border-color:var(--momo);color:var(--momo);}
.slot-btn.active{background:var(--momo);color:#fff;border-color:var(--momo);}
.slot-btn.all.active{background:var(--blue);border-color:var(--blue);}
.q-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.reload-btn{padding:6px 14px;border-radius:7px;background:var(--blue);color:#fff;border:none;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;}
.reload-btn:hover{background:#1d4ed8;}
.last-update{font-size:11px;color:var(--text-dim);}

/* 統計卡 */
.stat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.sc-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.sc-label{font-size:11px;color:var(--text-dim);}
.sc-ico{font-size:18px;}
.sc-val{font-size:22px;font-weight:700;font-family:'DM Mono',monospace;}
.sc-note{font-size:11px;color:var(--text-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 時段進度 */
.slot-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);flex-wrap:wrap;}
.slot-chip{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:700;border:1px solid var(--border);}
.slot-chip.done{background:var(--green-lt);color:var(--green);border-color:#86efac;}
.slot-chip.active{background:var(--momo);color:#fff;border-color:var(--momo);}
.slot-chip.pending{color:var(--text-dim);background:#f8fafc;}
.slot-chip.gap{color:#b8bec7;background:#f8fafc;text-decoration:line-through;}
.slot-chip.listing{color:#64748b;background:#e2e8f0;}
tr.listing-row td{background:#f8fafc;color:#64748b;}
.listing-tag{font-size:11px;font-weight:700;color:#64748b;background:#e2e8f0;padding:2px 7px;border-radius:5px;white-space:nowrap;}
.slot-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.slot-chip.active .slot-dot{background:#fff;animation:blink 1.5s infinite;}

/* 主表格 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);}
.card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.card-dot{width:7px;height:7px;border-radius:50%;}
.sort-note{font-size:11px;color:var(--text-dim);}
table{width:100%;border-collapse:collapse;}
thead th{padding:9px 14px;text-align:left;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;background:#f8fafc;border-bottom:1px solid var(--border);font-weight:500;}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#f8fafc;}
tbody td{padding:9px 14px;vertical-align:middle;}
.slot-tag{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700;white-space:nowrap;}
.tag-0000{background:#f1f5f9;color:#64748b;}
.tag-0700{background:var(--green-lt);color:var(--green);}
.tag-1100{background:var(--blue-lt);color:var(--blue);}
.tag-1400{background:#ede9fe;color:#7c3aed;}
.tag-1800{background:var(--orange-lt);color:var(--orange);}
.tag-2200{background:#fce7f3;color:var(--momo);}
.prod-name{font-weight:600;font-size:12px;}
.prod-brand{font-size:11px;color:var(--text-dim);}
.icode-link{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);text-decoration:none;white-space:nowrap;}
.icode-link:hover{color:var(--blue);text-decoration:underline;}
.disc-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;background:var(--orange-lt);color:var(--orange);}
.rate-wrap{display:flex;align-items:center;gap:7px;}
.rate-track{width:70px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.rate-fill{height:100%;border-radius:3px;}
.sold-num{font-family:'DM Mono',monospace;font-size:14px;font-weight:700;}
.sold-out-tag{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:4px;background:var(--red-lt);color:var(--red);font-size:10px;font-weight:700;}
.qty{font-family:'DM Mono',monospace;font-size:12px;}
.zero{color:var(--text-dim);}

/* 底部 */
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.dist-body{padding:16px;}
.dist-title{font-size:12px;font-weight:700;color:var(--text-mid);margin-bottom:12px;}
.dist-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.dist-lbl{width:80px;font-size:11px;color:var(--text-dim);flex-shrink:0;}
.dist-track{flex:1;height:16px;background:var(--border);border-radius:4px;overflow:hidden;}
.dist-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:10px;color:#fff;font-weight:700;}
.dist-n{width:20px;text-align:right;font-size:11px;font-family:'DM Mono',monospace;color:var(--text-dim);}
.sum-body{padding:16px;}
.sum-title{font-size:12px;font-weight:700;color:var(--text-mid);margin-bottom:12px;}
.sum-row{display:flex;justify-content:space-between;padding:8px 12px;border-radius:7px;background:var(--bg);margin-bottom:6px;font-size:12px;}
.sum-lbl{color:var(--text-mid);}
.sum-val{font-family:'DM Mono',monospace;font-weight:700;}

/* 歷史比較彈窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000;}
.modal-box{background:var(--surface);border-radius:var(--radius);max-width:640px;width:92%;max-height:80vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25);}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
.modal-title{font-size:14px;font-weight:700;}
.modal-close{background:none;border:none;font-size:16px;cursor:pointer;color:var(--text-dim);}
.modal-close:hover{color:var(--text);}
.modal-body{padding:14px 18px;}
.modal-body table{width:100%;border-collapse:collapse;font-size:12px;}
.modal-body th{text-align:left;padding:6px 8px;color:var(--text-dim);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--border);}
.modal-body td{padding:6px 8px;border-bottom:1px solid var(--border);}

/* 載入狀態 */
.loading{text-align:center;padding:60px;color:var(--text-dim);}
.loading-spin{font-size:32px;animation:spin 1s linear infinite;display:inline-block;margin-bottom:12px;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.error-msg{background:var(--red-lt);color:var(--red);padding:16px;border-radius:var(--radius);margin-bottom:16px;font-size:13px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <div class="icon">📦</div>
    AI 程式作業，銷售監控
    <div class="topbar-nav">
      <a href="dashboard.html" class="active">即時監控</a>
      <a href="analysis.html">交叉分析</a>
    </div>
  </div>
  <div class="topbar-right">
    <span><span class="live-dot"></span>即時資料</span>
    <span id="lastUpdate">載入中...</span>
  </div>
</div>

<div class="content">

  <!-- 查詢列 -->
  <div class="query-bar">
    <span class="q-label">📅 日期</span>
    <input type="date" id="queryDate" class="q-date" onchange="filterData()">
    <span class="q-label">時段</span>
    <div style="display:flex;gap:5px;flex-wrap:wrap;" id="slotBtns">
      <button class="slot-btn all active" onclick="selectSlot('all',this)">全部</button>
      <button class="slot-btn" onclick="selectSlot('00:00',this)">00:00</button>
      <button class="slot-btn" onclick="selectSlot('07:00',this)">07:00</button>
      <button class="slot-btn" onclick="selectSlot('11:00',this)">11:00</button>
      <button class="slot-btn" onclick="selectSlot('14:00',this)">14:00</button>
      <button class="slot-btn" onclick="selectSlot('18:00',this)">18:00</button>
      <button class="slot-btn" onclick="selectSlot('22:00',this)">22:00</button>
    </div>
    <div class="q-right">
      <span class="last-update" id="csvLastUpdate"></span>
      <button class="reload-btn" onclick="loadData()">🔄 重新載入</button>
    </div>
  </div>

  <div id="alertBanner" style="display:none;background:#fef2f2;color:#991b1b;padding:10px 16px;border-radius:var(--radius);margin-bottom:12px;font-size:12px;line-height:1.7"></div>
  <div id="gapNotice" style="display:none;background:#f1f5f9;color:#475569;padding:10px 16px;border-radius:var(--radius);margin-bottom:12px;font-size:12px;line-height:1.7"></div>
  <div id="flagNotice" style="display:none;background:#fff7ed;color:#9a3412;padding:10px 16px;border-radius:var(--radius);margin-bottom:16px;font-size:12px"></div>
  <div id="errorMsg" class="error-msg" style="display:none"></div>
  <div id="loadingArea" class="loading">
    <div class="loading-spin">⏳</div>
    <div>載入資料中...</div>
  </div>

  <div id="mainContent" style="display:none">

    <!-- 統計卡 -->
    <div class="stat-grid" id="statCards"></div>

    <!-- 時段進度 -->
    <div class="slot-bar" id="slotBar"></div>

    <!-- 成效表格 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><div class="card-dot" style="background:var(--momo)"></div>商品成效明細</div>
        <div class="sort-note">依售出量排序 ・ <span style="color:var(--red)">紅字🔁</span> = 過去3日內重複上架 ・ <span style="color:var(--purple)">紫字▲</span> = 結束前 > 中段（可能加量）</div>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>#</th><th>商品名稱</th><th>時段</th>
              <th>折扣</th><th>活動價</th>
              <th>開檔</th><th>中段</th><th>結束前</th><th>售出</th><th>售出率</th><th>狀態</th>
            </tr>
          </thead>
          <tbody id="resultTable"></tbody>
        </table>
      </div>
    </div>

    <!-- 底部 -->
    <div class="bottom-grid">
      <div class="card">
        <div class="card-header"><div class="card-title"><div class="card-dot" style="background:var(--green)"></div>售出率分布</div></div>
        <div class="dist-body" id="distChart"></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title"><div class="card-dot" style="background:var(--orange)"></div>本日摘要</div></div>
        <div class="sum-body" id="summary"></div>
      </div>
    </div>

  </div>
</div>

<div id="historyModalOverlay" class="modal-overlay" onclick="closeHistoryModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div id="modalTitle" class="modal-title"></div>
      <button class="modal-close" onclick="closeHistoryModal()">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script src="datepicker.js?v=1"></script>
<script>
// ── 設定：你的 GitHub 帳號和 repo 名稱 ──
const GITHUB_USER = 'jerrycp-lab';
const GITHUB_REPO = 'momo-sales-monitor';
const CSV_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/snapshots/all_results.csv`;
// ─────────────────────────────────────────

let allData = [];
let listingData = [];   // 抓取中斷檔期的商品明細（listing_only.csv），只供查詢，不計入任何統計
let curSlot = 'all';

// 頁面載入時自動讀取資料
window.addEventListener('load', loadData);

function dates_of(rows) { return [...new Set(rows.map(r => r.date))].sort(); }

// 讀 data_alerts.csv（check_anomalies.py 產生），只顯示最新資料日往前 3 天的「高／中」告警；檔案不存在就靜默略過
// 告警檔的說明欄可能含逗號（以雙引號包住），所以用支援引號的解析
function parseQuotedCSV(text) {
  const out = []; let row = [], cur = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.length > 1 || row[0] !== '') out.push(row); row = []; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); out.push(row); }
  const head = out.shift() || [];
  return out.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] || ''])));
}

async function loadAlerts(dates) {
  const box = document.getElementById('alertBanner');
  box.style.display = 'none';
  try {
    const res = await fetch(CSV_URL.replace('all_results.csv', 'data_alerts.csv') + '?t=' + Date.now());
    if (!res.ok) return;
    const rows = parseQuotedCSV(await res.text());
    // 以「今天（台灣時間）」與最後資料日取較晚者往前 3 天；整天抓不到資料的日子也要顯示
    const twToday = new Date(Date.now() + (new Date().getTimezoneOffset() + 480) * 60000);
    const lastData = dates.length ? dates[dates.length - 1] : '';
    const fmt = dt => `${dt.getFullYear()}/${String(dt.getMonth() + 1).padStart(2, '0')}/${String(dt.getDate()).padStart(2, '0')}`;
    let endStr = fmt(twToday); if (lastData > endStr) endStr = lastData;
    const [ey, em, ed] = endStr.split('/').map(Number);
    const recent = new Set([0, 1, 2].map(i => fmt(new Date(ey, em - 1, ed - i))));
    const list = rows.filter(a => recent.has(a.date) && a.severity !== '低');
    if (!list.length) return;
    const esc = t => String(t || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    list.sort((x, y) => (y.date + y.slot).localeCompare(x.date + x.slot));
    box.innerHTML = `🚨 <b>近 3 天數據告警 ${list.length} 則</b>（高 ${list.filter(a => a.severity === '高').length} / 中 ${list.filter(a => a.severity === '中').length}）<br>` +
      list.slice(0, 8).map(a => `<span style="opacity:.75">${esc(a.date)} ${esc(a.slot)}</span> [${esc(a.severity)}] ${esc(a.type)}${a.name ? '：' + esc(a.name) : ''} — ${esc(a.detail)}`).join('<br>') +
      (list.length > 8 ? `<br>…另有 ${list.length - 8} 則，詳見 snapshots/data_alerts.csv` : '');
    box.style.display = 'block';
  } catch (e) { /* 告警是附加功能，失敗不影響主頁 */ }
}

async function loadData() {
  document.getElementById('loadingArea').style.display = 'block';
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';

  try {
    // 加上時間戳避免瀏覽器 cache
    const res = await fetch(CSV_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('無法讀取資料（' + res.status + '）');
    const text = await res.text();
    allData = parseCSV(text);

    if (allData.length === 0) throw new Error('資料檔案是空的');
    applyDataFlags(allData);
    flagRows(allData);
    loadAlerts(dates_of(allData));

    listingData = [];
    try {
      const lres = await fetch(CSV_URL.replace('all_results.csv', 'listing_only.csv') + '?t=' + Date.now());
      if (lres.ok) listingData = parseQuotedCSV(await lres.text()).filter(r => r.date && r.slot).map(r => ({ ...r, _listing: true }));
    } catch (e) { /* 檔案不存在不影響主頁 */ }
    MomoDates.attach(document.getElementById('queryDate'));
    MomoDates.build(allData, listingData);

    // 設定日期預設值為最新日期
    const dates = [...new Set(allData.map(r => r.date))].sort();
    const latestDate = dates[dates.length - 1];
    const dateInput = document.getElementById('queryDate');
    if (latestDate) {
      dateInput.value = latestDate.replace(/\//g, '-');
    }
    dateInput.max = new Date().toISOString().split('T')[0];

    document.getElementById('lastUpdate').textContent = '最後載入：' + new Date().toLocaleTimeString('zh-TW');
    document.getElementById('csvLastUpdate').textContent = '資料日期：' + latestDate;

    document.getElementById('loadingArea').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    renderAll();

  } catch(e) {
    document.getElementById('loadingArea').style.display = 'none';
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'block';
    errEl.textContent = '⚠️ 載入失敗：' + e.message + '（資料可能還未產生，請稍後重試）';
  }
}

// ── 資料旗標：加量／疑似異常開檔 ──
// restock      ：結束前庫存 > 中段庫存 → 可能有加量操作，售出（= 開檔 − 結束前）預估偏低
// openSuspect  ：2026/11/01 前的舊資料，開檔是「提前抓」、數字與同商品前一檔的結束前完全相同（共用庫存口徑），
//                但中段已掉到開檔的 20% 以下（例：魚油 4476 → 290）。可信度低，預設不計入統計（可取消勾選）
// openSwitched ：新版抓取程式發現開檔後 3 分鐘庫存驟降，已改用開檔後數字，qty_pre 保留提前抓的數字
const OPEN_FIX_FROM = '2026/11/03';   // 此日起使用新版抓取程式（momo_scraper v11），之後不再用 openSuspect 規則
const SLOT_SEQ = ['00:00','07:00','11:00','14:00','18:00','22:00'];
function flagRows(rows) {
  const num = v => (v !== undefined && v !== '' && /^\d+$/.test(v)) ? parseInt(v) : null;
  const byKey = {};
  rows.forEach(r => { (byKey[r.date + '|' + r.icode] = byKey[r.date + '|' + r.icode] || {})[r.slot] = r; });
  rows.forEach(r => {
    r.restock = false; r.openSuspect = false; r.openSwitched = false;
    if (r.est) return;   // 千位數推估／存疑列已另外以紅字處理
    const o = num(r.qty_open), m = num(r.mid_qty), c = num(r.qty_close), p = num(r.qty_pre);
    // 2026/10/07 11:00 檔（含）以前的舊版程式會把千位數漏讀成個位數（中段 1～9），這種不當作加量
    const oldParser = r.date < '2026/10/07' || (r.date === '2026/10/07' && r.slot <= '11:00');
    if (m !== null && c !== null && c > m && !(oldParser && m <= 9)) r.restock = true;
    if (p !== null && o !== null && p > o) r.openSwitched = true;
    if (r.open_source === 'pre' && r.date < OPEN_FIX_FROM && o !== null && o >= 200 && m !== null && m <= o * 0.2) {
      const i = SLOT_SEQ.indexOf(r.slot);
      const prev = i > 0 ? (byKey[r.date + '|' + r.icode] || {})[SLOT_SEQ[i - 1]] : null;
      if (prev && num(prev.qty_close) === o) r.openSuspect = true;
    }
  });
}
// ── momo 商品頁連結：用品號（icode）組網址，不需另外儲存 ──
function momoUrl(icode) { return 'https://www.momoshop.com.tw/goods/GoodsDetail.jsp?i_code=' + String(icode).replace(/\D/g, ''); }
function icodeLink(icode) {
  const id = String(icode).replace(/\D/g, '');
  return `<a class="icode-link" href="${momoUrl(id)}" target="_blank" rel="noopener noreferrer" title="在 momo 開啟商品頁（商品下架後可能打不開）" onclick="event.stopPropagation()">品號 ${id} 🔗</a>`;
}
// ── 歷史資料修正：讀取 all_results.csv 的 data_flag / raw_values ──
// data_flag = calc（開檔已推估還原）／doubt（存疑、數量以 0 計）；raw_values = 開檔|中段|結束前|售出|售出率（原始值）
// 若 CSV 還沒有這兩個欄位（尚未執行 repair_history.py），退回用前端推估（fixTruncatedQty）
function applyDataFlags(rows) {
  if (!rows.length || !('data_flag' in rows[0])) { if (typeof fixTruncatedQty === 'function') fixTruncatedQty(rows); return; }
  rows.forEach(r => {
    if (r.data_flag !== 'calc' && r.data_flag !== 'doubt') return;
    const [ro, rm, rc, rs] = (r.raw_values || '').split('|');
    r.est = r.data_flag;
    if (r.data_flag === 'calc') { r.qty_open_raw = ro; r.sold_raw = rs; if ((rm || '') !== r.mid_qty) r.mid_est = true; }
    else { r.raw_text = `${ro} → ${rm ? rm : '-'} → ${rc}`; }
  });
}
function fmtInt(v) { const n = parseInt(v); return isNaN(n) ? v : n.toLocaleString('zh-TW'); }
function estTitle(r) {
  return r.est === 'calc' ? `原始紀錄為 ${r.qty_open_raw}（舊版程式漏讀千位數），以千位整數推估，售出量為保守估計` : `數量存疑（漏讀千位數、無法推估），以 0 計、不計入平均售出率。原始紀錄：${r.raw_text}`;
}
function restockTitle(r) { return `結束前庫存 ${r.qty_close} > 中段 ${r.mid_qty}：可能有加量操作，售出量預估可能偏低`; }
function openFlagTitle(r) {
  if (r.openSuspect) return `疑似異常：開檔為提前抓取的 ${r.qty_open}（與前一檔結束前相同），但中段已降到 ${r.mid_qty}，售出量可信度低`;
  if (r.openSwitched) return `提前抓為 ${r.qty_pre}，開檔後 3 分鐘庫存驟降，已改用開檔後數字 ${r.qty_open}`;
  return '';
}


function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/^\uFEFF/,''));
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
    return obj;
  }).filter(r => r.date);
}

function selectSlot(slot, btn) {
  document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  curSlot = slot;
  renderAll();
}

function filterData() { renderAll(); }

function getFilteredData() {
  const dateVal = document.getElementById('queryDate').value.replace(/-/g, '/');
  return allData.filter(r => {
    const dateMatch = !dateVal || r.date === dateVal;
    const slotMatch = curSlot === 'all' || r.slot === curSlot;
    return dateMatch && slotMatch;
  });
}

function getPrevDateStrings(dateStr, n) {
  const parts = dateStr.split('/').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return [];
  const base = new Date(parts[0], parts[1]-1, parts[2]);
  const arr = [];
  for (let i = 1; i <= n; i++) {
    const dt = new Date(base);
    dt.setDate(dt.getDate() - i);
    const yy = dt.getFullYear();
    const mm = String(dt.getMonth()+1).padStart(2,'0');
    const dd = String(dt.getDate()).padStart(2,'0');
    arr.push(`${yy}/${mm}/${dd}`);
  }
  return arr;
}

function getDuplicateIcodeSet(dateVal) {
  const prevDates = getPrevDateStrings(dateVal, 3);
  const iSet = new Set();
  allData.forEach(r => { if (prevDates.includes(r.date)) iSet.add(r.icode); });
  return iSet;
}

function showHistoryModal(icode) {
  const dateVal = document.getElementById('queryDate').value.replace(/-/g, '/');
  const rangeDates = [dateVal, ...getPrevDateStrings(dateVal, 3)];
  const rows = allData.filter(r => r.icode === icode && rangeDates.includes(r.date));
  rows.sort((a,b) => {
    if (a.date !== b.date) return b.date.localeCompare(a.date);
    return a.slot.localeCompare(b.slot);
  });
  if (rows.length === 0) return;

  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  document.getElementById('modalTitle').innerHTML = `${esc(rows[0].name)}（${esc(rows[0].brand)}） ${icodeLink(rows[0].icode)}`;
  const trs = rows.map(r => {
    const mid = (r.mid_qty !== undefined && r.mid_qty !== '') ? r.mid_qty : '-';
    return `<tr>
      <td>${r.date}</td><td>${r.slot}</td><td>${r.discount}</td><td>$${r.price}</td>
      <td ${r.est ? `style="color:var(--red);font-weight:700" title="${estTitle(r)}"` : (r.openSuspect || r.openSwitched) ? `style="color:var(--orange);font-weight:700" title="${openFlagTitle(r)}"` : ''}>${r.est === 'calc' ? '約' + fmtInt(r.qty_open) : r.qty_open}${(!r.est && (r.openSuspect || r.openSwitched)) ? ' ⚠' : ''}</td><td ${(r.est === 'doubt' || r.mid_est) ? 'style="color:var(--red)"' : ''}>${r.mid_est ? '約' + fmtInt(mid) : mid}</td>
      <td ${r.restock ? `style="color:var(--purple);font-weight:700" title="${restockTitle(r)}"` : ''}>${r.qty_close}${r.restock ? ' ▲' : ''}</td>
      <td>${r.sold||'-'}</td><td>${r.sell_rate}%</td>
    </tr>`;
  }).join('');
  document.getElementById('modalBody').innerHTML = `
    <table>
      <thead><tr><th>日期</th><th>時段</th><th>折扣</th><th>活動價</th><th>開檔</th><th>中段</th><th>結束前</th><th>售出</th><th>售出率</th></tr></thead>
      <tbody>${trs}</tbody>
    </table>`;
  document.getElementById('historyModalOverlay').style.display = 'flex';
}

function closeHistoryModal(e) {
  document.getElementById('historyModalOverlay').style.display = 'none';
}
  
function renderAll() {
  const allRows = getFilteredData();
  const data = allRows.filter(r => !r.openSuspect);   // 統計排除疑似異常開檔列，表格仍顯示並標 ⚠
  renderFlagNotice(allRows);
  const dateVal = document.getElementById('queryDate').value.replace(/-/g, '/');
  const listRows = listingData.filter(r => r.date === dateVal && (curSlot === 'all' || r.slot === curSlot));
  renderGapNotice(dateVal);
  const dupSet = getDuplicateIcodeSet(dateVal);
  renderStats(data);
  renderSlotBar();
  renderTable(allRows, dupSet, listRows);
  renderDist(data);
  renderSummary(data);
}

// 抓取中斷的檔期提示（依 datepicker.js 算出的每日狀態）
function renderGapNotice(dateVal) {
  const el = document.getElementById('gapNotice');
  const s = MomoDates.info(dateVal);
  if (!dateVal || !s.gray || s.outOfRange) { el.style.display = 'none'; return; }
  const parts = [];
  if (s.missing.length) parts.push(`<b>無資料</b>：${s.missing.join('、')}`);
  if (s.listing.length) parts.push(`<b>僅保留商品明細</b>：${s.listing.join('、')}（品號、價格、數量可查詢；不含售出量、營收，不計入任何統計）`);
  el.innerHTML = `⏸ 此日部分檔期抓取中斷。${parts.join('；')}`;
  el.style.display = 'block';
}

function renderFlagNotice(rows) {
  const el = document.getElementById('flagNotice');
  const suspect = rows.filter(r => r.openSuspect).length;
  const restock = rows.filter(r => r.restock).length;
  const switched = rows.filter(r => r.openSwitched).length;
  if (!suspect && !restock && !switched) { el.style.display = 'none'; return; }
  const parts = [];
  if (suspect) parts.push(`<b>${suspect}</b> 筆疑似異常開檔列（⚠存疑）已排除，不計入上方統計與下方分布／摘要`);
  if (switched) parts.push(`<b>${switched}</b> 筆因開檔後 3 分鐘庫存驟降，已改用開檔後數字（⚠）`);
  if (restock) parts.push(`<b>${restock}</b> 筆「結束前 > 中段」（<span style="color:var(--purple);font-weight:700">紫字 ▲</span>），可能有加量操作，售出量預估偏低`);
  el.style.display = 'block';
  el.innerHTML = '📌 本日範圍內：' + parts.join('；') + '。';
}

function renderStats(data) {
  const total    = data.length;
  const hasSales = data.filter(r => parseInt(r.sold) > 0).length;
  const soldOut  = data.filter(r => r.sold_out === '是').length;
  const maxSold  = data.reduce((m, r) => Math.max(m, parseInt(r.sold)||0), 0);
  const maxItem  = data.find(r => (parseInt(r.sold)||0) === maxSold);
  const rateRows = data.filter(r => r.est !== 'doubt');   // 存疑列不計入平均售出率
  const avgRate  = rateRows.length ? (rateRows.reduce((s,r)=>s+(parseFloat(r.sell_rate)||0),0)/rateRows.length).toFixed(1) : 0;
  const revenue  = data.reduce((s,r) => s + ((parseFloat(r.price)||0) * (parseInt(r.sold)||0)), 0);
  const revenueFmt = '$' + Math.round(revenue).toLocaleString('zh-TW');
  if (!total) {   // 沒有銷售資料（例如抓取中斷、只剩商品明細的日子）：統計卡顯示「—」
    const lbl = ['檔期總營收','最高售出量','查詢商品數','有銷售商品','售完下架','平均售出率'];
    document.getElementById('statCards').innerHTML = lbl.map(l => `<div class="stat-card"><div class="sc-row"><div class="sc-label">${l}</div></div><div class="sc-val" style="color:#cbd5e1">—</div><div class="sc-note">無銷售資料</div></div>`).join('');
    return;
  }

  document.getElementById('statCards').innerHTML = `
    <div class="stat-card"><div class="sc-row"><div class="sc-label">檔期總營收</div><div class="sc-ico">💰</div></div><div class="sc-val" style="color:var(--momo)">${revenueFmt}</div><div class="sc-note">${curSlot==='all'?'全時段':'僅 '+curSlot+' 檔'}</div></div>
    <div class="stat-card"><div class="sc-row"><div class="sc-label">最高售出量</div><div class="sc-ico">🏆</div></div><div class="sc-val" style="color:var(--orange)">${maxSold}</div><div class="sc-note">${maxItem?maxItem.name.slice(0,12):'—'}</div></div>
    <div class="stat-card"><div class="sc-row"><div class="sc-label">查詢商品數</div><div class="sc-ico">🛒</div></div><div class="sc-val" style="color:var(--blue)">${total}</div><div class="sc-note">${curSlot==='all'?'全時段':'僅 '+curSlot+' 檔'}</div></div>
    <div class="stat-card"><div class="sc-row"><div class="sc-label">有銷售商品</div><div class="sc-ico">✅</div></div><div class="sc-val" style="color:var(--green)">${hasSales}</div><div class="sc-note">${total?((hasSales/total*100).toFixed(0))+'% 商品有賣出':'-'}</div></div>
    <div class="stat-card"><div class="sc-row"><div class="sc-label">售完下架</div><div class="sc-ico">🔥</div></div><div class="sc-val" style="color:var(--red)">${soldOut}</div><div class="sc-note">100% 售出率</div></div>
    <div class="stat-card"><div class="sc-row"><div class="sc-label">平均售出率</div><div class="sc-ico">📊</div></div><div class="sc-val" style="color:var(--text-mid)">${avgRate}%</div><div class="sc-note">全部商品平均</div></div>
  `;
}

function renderSlotBar() {
  const dateVal = document.getElementById('queryDate').value.replace(/-/g,'/');
  const slots = ['00:00','07:00','11:00','14:00','18:00','22:00'];
  const doneSlots = [...new Set(allData.filter(r=>r.date===dateVal).map(r=>r.slot))];
  const st = MomoDates.info(dateVal);
  const chips = slots.map(s => {
    const isDone = doneSlots.includes(s);
    if (isDone) return `<div class="slot-chip done"><div class="slot-dot"></div>${s} ✓</div>`;
    if (st.listing.includes(s)) return `<div class="slot-chip listing" title="抓取中斷，僅保留商品明細"><div class="slot-dot"></div>${s} 僅明細</div>`;
    if (st.missing.includes(s)) return `<div class="slot-chip gap" title="抓取中斷，無資料"><div class="slot-dot"></div>${s} 無資料</div>`;
    return `<div class="slot-chip pending"><div class="slot-dot"></div>${s}</div>`;
  }).join('');
  document.getElementById('slotBar').innerHTML =
    `<span style="font-size:11px;color:var(--text-dim);white-space:nowrap">時段狀態</span>${chips}`;
}

function slotTagClass(slot) {
  const map = {'00:00':'tag-0000','07:00':'tag-0700','11:00':'tag-1100','14:00':'tag-1400','18:00':'tag-1800','22:00':'tag-2200'};
  return map[slot] || 'tag-0700';
}

function renderTable(data, dupSet, listRows) {
  dupSet = dupSet || new Set();
  listRows = listRows || [];
  const sorted = [...data].sort((a,b) => (parseInt(b.sold)||0)-(parseInt(a.sold)||0));
  const rows = sorted.map((r, i) => {
    const sold = parseInt(r.sold) || 0;
    const rate = parseFloat(r.sell_rate) || 0;
    const isSoldOut = r.sold_out === '是';
    const barColor = rate >= 30 ? 'var(--red)' : rate >= 10 ? 'var(--orange)' : rate > 0 ? 'var(--blue)' : 'var(--border2)';
    const barW = Math.min(rate, 100);
    const midDisplay = (r.mid_qty !== undefined && r.mid_qty !== '') ? r.mid_qty : '-';
const isDup = dupSet.has(r.icode);
    const nameStyle = isDup ? 'style="color:var(--red);cursor:pointer;text-decoration:underline dotted;"' : '';
    const nameOnClick = isDup ? `onclick="showHistoryModal('${r.icode}')"` : '';
    const nameTitle = isDup ? 'title="點擊查看近3日上架紀錄"' : '';
    return `<tr>
      <td style="color:var(--text-dim);font-family:'DM Mono',monospace;font-size:11px">${i+1}</td>
      <td><div class="prod-name" ${nameStyle} ${nameOnClick} ${nameTitle}>${r.name}${isDup?' 🔁':''}</div><div class="prod-brand">${r.brand} ・ ${icodeLink(r.icode)}</div></td>
      <td><span class="slot-tag ${slotTagClass(r.slot)}">${r.slot}</span></td>
      <td><span class="disc-badge">${r.discount}</span></td>
      <td style="font-family:'DM Mono',monospace">$${r.price}</td>
      <td class="qty" ${r.est ? `style="color:var(--red);font-weight:700" title="${estTitle(r)}"` : (r.openSuspect || r.openSwitched) ? `style="color:var(--orange);font-weight:700" title="${openFlagTitle(r)}"` : ''}>${r.est === 'calc' ? '約' + fmtInt(r.qty_open) : r.qty_open}${(!r.est && (r.openSuspect || r.openSwitched)) ? ' ⚠' : ''}</td>
      <td class="qty" ${(r.est === 'doubt' || r.mid_est) ? 'style="color:var(--red)"' : ''}>${r.mid_est ? '約' + fmtInt(midDisplay) : midDisplay}</td>
      <td class="qty" ${r.est === 'doubt' ? 'style="color:var(--red)"' : r.restock ? `style="color:var(--purple);font-weight:700" title="${restockTitle(r)}"` : ''}>${r.qty_close}${r.restock ? ' ▲' : ''}</td>
      <td><span class="sold-num ${sold===0?'zero':''}" style="color:${r.est?'var(--red)':sold>0?'var(--blue)':'var(--text-dim)'}">${r.est === 'calc' ? '約' + fmtInt(sold) : (sold||'-')}</span></td>
      <td><div class="rate-wrap"><div class="rate-track"><div class="rate-fill" style="width:${barW}%;background:${barColor}"></div></div><div style="font-size:11px;font-family:'DM Mono',monospace;min-width:38px;color:${barColor}">${rate}%</div></div></td>
      <td>${isSoldOut?'<span class="sold-out-tag">🔥 售完</span>':''}${r.restock?'<span title="'+restockTitle(r)+'" style="color:var(--purple);font-size:11px;font-weight:700"> 📈加量</span>':''}${r.openSuspect?'<span title="'+openFlagTitle(r)+'" style="color:var(--orange);font-size:11px;font-weight:700"> ⚠存疑</span>':''}</td>
    </tr>`;
  }).join('');
  // 抓取中斷檔期的商品明細：只顯示品項、價格、數量，不顯示售出／售出率
  const dash = '<span style="color:#cbd5e1">—</span>';
  const q = v => (v !== undefined && v !== '') ? v : dash;
  const sortedList = [...listRows].sort((a,b) => a.slot.localeCompare(b.slot) || (parseInt(b.qty_open || b.mid_qty || b.qty_close)||0) - (parseInt(a.qty_open || a.mid_qty || a.qty_close)||0));
  const lrows = sortedList.map((r, i) => `<tr class="listing-row" title="${r.note || '抓取中斷，僅保留商品明細'}">
      <td style="font-family:'DM Mono',monospace;font-size:11px">${sorted.length + i + 1}</td>
      <td><div class="prod-name" style="color:#475569">${r.name}</div><div class="prod-brand">${r.brand} ・ ${icodeLink(r.icode)}</div></td>
      <td><span class="slot-tag ${slotTagClass(r.slot)}">${r.slot}</span></td>
      <td><span class="disc-badge">${r.discount}</span></td>
      <td style="font-family:'DM Mono',monospace">$${r.price}</td>
      <td class="qty" ${r.open_source === 'pre' ? 'title="開檔前（提前抓）的數量"' : ''}>${q(r.qty_open)}</td>
      <td class="qty">${q(r.mid_qty)}</td>
      <td class="qty">${q(r.qty_close)}</td>
      <td>${dash}</td><td>${dash}</td>
      <td><span class="listing-tag">僅明細</span></td>
    </tr>`).join('');
  const sep = (rows && lrows) ? `<tr><td colspan="11" style="background:#f1f5f9;color:#64748b;font-size:11px;padding:6px 12px">以下為抓取中斷檔期的商品明細（不含售出量，不計入統計）</td></tr>` : '';
  document.getElementById('resultTable').innerHTML = (rows + sep + lrows) || '<tr><td colspan="11" style="text-align:center;color:var(--text-dim);padding:30px">此日期/時段無資料</td></tr>';
}

function renderDist(data) {
  const ranges = [
    {lbl:'售完（100%）', min:100, max:100, color:'var(--red)'},
    {lbl:'30–99%',       min:30,  max:99,  color:'var(--orange)'},
    {lbl:'10–30%',       min:10,  max:29,  color:'#eab308'},
    {lbl:'1–10%',        min:1,   max:9,   color:'var(--blue)'},
    {lbl:'0%（零售）',   min:0,   max:0,   color:'var(--border2)'},
  ];
  const maxCount = Math.max(...ranges.map(r => data.filter(d => {
    const rt = parseFloat(d.sell_rate)||0;
    return rt >= r.min && rt <= r.max;
  }).length), 1);

  const bars = ranges.map(r => {
    const cnt = data.filter(d => {
      const rt = parseFloat(d.sell_rate)||0;
      return rt >= r.min && rt <= r.max;
    }).length;
    const w = Math.round(cnt / maxCount * 100);
    return `<div class="dist-row">
      <div class="dist-lbl">${r.lbl}</div>
      <div class="dist-track"><div class="dist-fill" style="width:${w}%;background:${r.color}">${cnt>0?cnt:''}</div></div>
      <div class="dist-n">${cnt}</div>
    </div>`;
  }).join('');
  document.getElementById('distChart').innerHTML = `<div class="dist-title">售出率區間分布（${data.length} 件）</div>${bars}`;
}

function renderSummary(data) {
  const total   = data.length;
  const hasSold = data.filter(r => parseInt(r.sold)>0);
  const soldOut = data.filter(r => r.sold_out==='是');
  const zeroSale= data.filter(r => (parseInt(r.sold)||0)===0);
  const topItem = [...data].sort((a,b)=>(parseInt(b.sold)||0)-(parseInt(a.sold)||0))[0];
  const topRate = [...data].sort((a,b)=>(parseFloat(b.sell_rate)||0)-(parseFloat(a.sell_rate)||0))[0];
  const rateRows = data.filter(r => r.est !== 'doubt');
  const avgRate = rateRows.length ? (rateRows.reduce((s,r)=>s+(parseFloat(r.sell_rate)||0),0)/rateRows.length).toFixed(1) : 0;

  document.getElementById('summary').innerHTML = `
    <div class="sum-title">篩選範圍摘要</div>
    <div class="sum-row"><span class="sum-lbl">商品數</span><span class="sum-val">${total} 件</span></div>
    <div class="sum-row"><span class="sum-lbl">有銷售</span><span class="sum-val" style="color:var(--green)">${hasSold.length} 件（${total?(hasSold.length/total*100).toFixed(0):0}%）</span></div>
    <div class="sum-row"><span class="sum-lbl">售完下架</span><span class="sum-val" style="color:var(--red)">${soldOut.length} 件</span></div>
    <div class="sum-row"><span class="sum-lbl">零銷售</span><span class="sum-val" style="color:var(--text-dim)">${zeroSale.length} 件</span></div>
    <div class="sum-row"><span class="sum-lbl">最高售出量</span><span class="sum-val" style="color:var(--blue)">${topItem?(parseInt(topItem.sold)||0)+' 件（'+topItem.name.slice(0,10)+'）':'—'}</span></div>
    <div class="sum-row"><span class="sum-lbl">最高售出率</span><span class="sum-val" style="color:var(--momo)">${topRate?(parseFloat(topRate.sell_rate)||0)+'%（'+topRate.name.slice(0,10)+'）':'—'}</span></div>
    <div class="sum-row"><span class="sum-lbl">平均售出率</span><span class="sum-val">${avgRate}%</span></div>
  `;
}
</script>
</body>
</html>
